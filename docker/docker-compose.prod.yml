version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: arca_postgres
    restart: always
    environment:
      POSTGRES_DB: arca
      POSTGRES_USER: arca_user
      POSTGRES_PASSWORD: arca_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arca_user -d arca"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - arca_network

  redis:
    image: redis:7-alpine
    container_name: arca_redis
    restart: always
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - arca_network

  backend:
    build:
      context: ../arca_backend
      dockerfile: ../docker/backend.Dockerfile
    container_name: arca_backend
    restart: always
    environment:
      DATABASE_URL: postgresql://arca_user:arca_pass@postgres:5432/arca
      PORT: 3001
      NODE_ENV: production
      AI_SERVICE_URL: http://ai:8000
      FRONTEND_URL: http://localhost:5173
      JWT_SECRET: ${JWT_SECRET:-arca_compliance_secret_key}
      JIRA_BASE_URL: ${JIRA_BASE_URL:-https://mock-jira.atlassian.net}
      JIRA_EMAIL: ${JIRA_EMAIL:-compliance-admin@canarabank.com}
      JIRA_API_TOKEN: ${JIRA_API_TOKEN:-mock_jira_token_for_hackathon}
      SMTP_HOST: smtp.mailtrap.io
      SMTP_PORT: 2525
    volumes:
      - backend_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - arca_network

  ai:
    build:
      context: ../arca_ai_service
      dockerfile: ../docker/ai.Dockerfile
    container_name: arca_ai_service
    restart: always
    environment:
      BACKEND_URL: http://backend:3001
      DATABASE_URL: postgresql://arca_user:arca_pass@postgres:5432/arca
      REDIS_URL: redis://redis:6379/0
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      GROQ_API_KEY: ${GROQ_API_KEY}
      CHROMA_PERSIST_PATH: /app/data/chroma_db
    depends_on:
      - backend
    volumes:
      - ai_data:/app/data
    networks:
      - arca_network

  frontend:
    build:
      context: ../arca_frontend
      dockerfile: ../docker/frontend.Dockerfile
    container_name: arca_frontend
    restart: always
    environment:
      VITE_BACKEND_URL: http://localhost
      VITE_AI_URL: http://localhost
    depends_on:
      - backend
      - ai
    networks:
      - arca_network

  nginx:
    image: nginx:alpine
    container_name: arca_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      # SSL Certbot certificate maps (enabled when certbot runs in production)
      # - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - frontend
      - backend
      - ai
    networks:
      - arca_network

volumes:
  postgres_data:
  redis_data:
  backend_uploads:
  ai_data:

networks:
  arca_network:
    name: arca_network
    driver: bridge
